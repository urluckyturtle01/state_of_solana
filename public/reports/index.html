<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEX Data Update Reports</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 2rem;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .timestamp {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .stat-card.success { border-left: 4px solid #10b981; }
        .stat-card.skipped { border-left: 4px solid #f59e0b; }
        .stat-card.failed { border-left: 4px solid #ef4444; }
        .stat-card.warning { border-left: 4px solid #f59e0b; }
        .stat-card.total { border-left: 4px solid #3b82f6; }
        .stat-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }
        .queries-section {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .section-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .query-item {
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .query-item.success { border-left: 3px solid #10b981; }
        .query-item.skipped { border-left: 3px solid #f59e0b; }
        .query-item.failed { border-left: 3px solid #ef4444; }
        .query-item.warning { border-left: 3px solid #f59e0b; }
        .query-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        .query-details {
            font-size: 0.85rem;
            color: #888;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge.success { background: #10b98120; color: #10b981; }
        .badge.skipped { background: #f59e0b20; color: #f59e0b; }
        .badge.failed { background: #ef444420; color: #ef4444; }
        .badge.warning { background: #f59e0b20; color: #f59e0b; }
        .error-msg {
            background: #2a1a1a;
            border: 1px solid #4a2a2a;
            border-radius: 4px;
            padding: 0.75rem;
            margin-top: 0.5rem;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #ff6b6b;
        }
        pre {
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.85rem;
            max-height: 600px;
            overflow-y: auto;
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 DEX Data Update Reports</h1>
        <div class="timestamp" id="timestamp">Loading...</div>
        
        <div class="summary">
            <div class="stat-card total">
                <div class="stat-label">Total Queries</div>
                <div class="stat-value" id="total-queries">-</div>
            </div>
            <div class="stat-card success">
                <div class="stat-label">Successful</div>
                <div class="stat-value" id="successful-queries">-</div>
            </div>
            <div class="stat-card skipped">
                <div class="stat-label">Skipped</div>
                <div class="stat-value" id="skipped-queries">-</div>
            </div>
            <div class="stat-card failed">
                <div class="stat-label">Failed</div>
                <div class="stat-value" id="failed-queries">-</div>
            </div>
        </div>

        <div class="queries-section">
            <div class="section-title">📋 Query Details</div>
            <div id="queries-list">
                <div class="loading">Loading query details...</div>
            </div>
        </div>

        <div class="queries-section">
            <div class="section-title">📝 Full Log</div>
            <pre id="full-log">Loading...</pre>
        </div>
    </div>

    <script>
        async function loadReport() {
            try {
                const response = await fetch('/reports/latest-report.json');
                const data = await response.json();
                
                // Update timestamp
                document.getElementById('timestamp').textContent = `Last updated: ${data.timestamp}`;
                
                // Update summary stats
                document.getElementById('total-queries').textContent = data.stats.total;
                document.getElementById('successful-queries').textContent = data.stats.successful;
                document.getElementById('skipped-queries').textContent = data.stats.skipped;
                document.getElementById('failed-queries').textContent = data.stats.failed;
                
                // Update queries list
                const queriesList = document.getElementById('queries-list');
                queriesList.innerHTML = data.queries.map(q => `
                    <div class="query-item ${q.status}">
                        <div class="query-name">${q.name}</div>
                        <div class="query-details">
                            <span class="badge ${q.status}">${q.status.toUpperCase()}</span>
                            <span>${q.details}</span>
                        </div>
                        ${q.error ? `<div class="error-msg">${q.error}</div>` : ''}
                    </div>
                `).join('');
                
                // Update full log
                document.getElementById('full-log').textContent = data.fullLog;
                
            } catch (error) {
                console.error('Error loading report:', error);
                document.getElementById('queries-list').innerHTML = 
                    '<div class="loading">Error loading report. Please check if the update has run.</div>';
            }
        }
        
        // Load report on page load
        loadReport();
        
        // Auto-refresh every 5 minutes
        setInterval(loadReport, 5 * 60 * 1000);
    </script>
</body>
</html>
